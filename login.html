<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-6 col-md-6 d-lg-block d-md-block d-none d-flex justify-content-center ">
               <div class="left_box d-flex justify-content-center  align-items-center mt-3">
               <img src="preview.jpg" alt="" class="w-50 h-50 rounded-4">
               </div>
            </div>
       <!-- RIGHT LOGIN -->
    <div class="col-lg-6 col-md-6 col-sm-12 d-sm-flex justify-content-sm-center outer_company_box">
            <div class="mt-3  w-75 w-lg-75 w-md-100 ps-sm-5" >
                <h4 class="mt-3 fw-bold pt-sm-5 mt-sm-5 " >Company bussiness tagline</h4>
                <h5 class="pt-3" >Welcome<i class="fa-solid fa-hands-clapping ms-2"></i></h5>
                <p>Please login here</p>
                <label for="">Email Address</label>
                 <div class="input-group mb-3 w-75 mt-2 outer-input">
  <span class="input-group-text icon_style " id="basic-addon1"><i class="fa-solid fa-envelope" style="color: lightgray;"></i></span>
  <input type="email" class="form-control   w-75 w-lg-75   placeholder_color"  aria-label="Username" aria-describedby="basic-addon1">
                 </div>
                <label for="">Password</label>
                <div class="input-group mb-3 w-75 mt-2 outer-input">
  <span class="input-group-text icon_style " id="basic-addon1"><i class="fa-solid fa-lock" style="color: lightgray;"></i></span>
  <input type="password" class="form-control w-75 placeholder_color"  aria-label="Username" aria-describedby="basic-addon1">
                 </div>
             <div class="d-flex">
                <div  class="me-2"><input type="checkbox" class="me-2 " ><label for="" class="fs-md-7 remember_me" >Remember Me</label></div>
                <p class="ps-5 ms-4 forget_password " >Forgot Password</p>
             </div>
                <button class="w-75 btn register_btn fw-bold " >Login</button>
          <p class="text-center ps-0 pe-5 me-5 mt-2" style="font-size: 12px; text-align: center;" >Don't have an account 
           <a href="signup.html">Signup</a>
          </p>
            </div>
          
        </div>
        </div>
    </div>
</body>
</html>
