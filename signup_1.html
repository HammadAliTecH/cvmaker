<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" ></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <title>Document</title>
    <!-- <link rel="stylesheet" href="style_1.css"> -->
     <style>
        .left_box
{
    height: 95vh;
    width: 95%;
    background-color: rgb(146, 145, 145);
    border-radius: 20px;
}
.logo-size
{
    height: 95px;
}
.login_heading {
font-family: 'Helvetica Neue', Arial, sans-serif;
font-weight: bold;
letter-spacing: -0.2px;
}
.wave{
  display:inline-block;
  animation: wave 1.5s infinite;
  transform-origin: 70% 70%;
}
.second_font{
font-family:
  "Segoe UI",
  Roboto,
  "Helvetica Neue",
  Arial,
  sans-serif;
font-weight: 400;
}
.label_font
{
    font-size: 13px;
}
/*  */
.outer-input
    {
        border: 1px solid gray;
        border-radius: 5px;
        
    }
    .placeholder_color
    {
      border: none;
      
    }
      .placeholder_color:focus
    {
      outline: none;
      border: none;
      box-shadow: none;
      
    }
    .placeholder_color::placeholder
    {
        color: lightgrey;
    }
    .icon_style
    {
        background-color: white;
        border: none;
    }
    .utility_font{
        font-size: 14px;
    }
    .login_color{
        background-color: orange;
        color: white;
        box-shadow: none;
    }
    .login_color:focus{
        box-shadow: none;
    }


     </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-6 d-flex justify-content-center pt-4 d-none d-lg-block">
                <div class="left_box d-flex justify-content-center align-items-center">
                    <div  >
                        <img src="logo.png" class="rounded logo-size " alt="">
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6 d-flex justify-content-center align-items-center mt-lg-none mt-5">

                <div class="" >
                <h1 class="login_heading" >Vantage Sales Pilot</h1>
                <h3 class="login_heading" >Welcome<span class="wave">👋</span></h3>
                <p class="second_font" >Please register here</p>
                <label for="" class="label_font">Name</label>
            <div class="input-group mb-2 w-100 mt-2 outer-input">
                <span class="input-group-text icon_style " id="basic-addon1"><i class="fa-solid fa-user" style="color: lightgray;"></i></span>
                <input type="text" class="form-control  placeholder_color "  aria-label="Username" aria-describedby="basic-addon1">
            </div>
              <label for="" class="label_font">Email</label>
            <div class="input-group mb-2 w-100 mt-2 outer-input">
                <span class="input-group-text icon_style " id="basic-addon1"><i class="fa-solid fa-envelope" style="color: lightgray;"></i></span>
                <input type="text" class="form-control  placeholder_color "  aria-label="Username" aria-describedby="basic-addon1">
            </div>
                  <label for="" class="label_font mt-3">Password</label>
            <div class="input-group mb-2 w-100 mt-2 outer-input">
                <span class="input-group-text icon_style " id="basic-addon1"><i class="fa-solid fa-lock" style="color: lightgray;"></i></span>
                <input type="password" class="form-control  placeholder_color "  aria-label="Username" aria-describedby="basic-addon1">
            </div>
              <label for="" class="label_font mt-3">Confirm Password</label>
            <div class="input-group mb-2 w-100 mt-2 outer-input">
                <span class="input-group-text icon_style " id="basic-addon1"><i class="fa-solid fa-lock" style="color: lightgray;"></i></span>
                <input type="password" class="form-control  placeholder_color "  aria-label="Username" aria-describedby="basic-addon1">
            </div>
           <div class="d-flex justify-content-between align-items-center mt-3">
  <div class="form-check">
    <input class="form-check-input " type="checkbox" id="remember">
    <label class="form-check-label utility_font" for="remember">
      Remember me
    </label>
  </div>
  
  <a href="#" class="text-decoration-none  text-dark utility_font">
    Forgot Password
  </a>
</div>
 <button class="form-control mt-3 utility_font login_color py-2" >Register</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
